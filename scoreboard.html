<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard - Vote Intern</title>
    <link rel="icon" type="image/png" href="logo-sm.png" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        /* แถบเมนูแอดมิน */
        .admin-bar {
            text-align: right;
            padding: 10px 20px;
            position: relative;
        }

        .btn-clear {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-clear:hover {
            background: #c0392b;
        }

        .btn-settings {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            margin-right: 10px;
            opacity: 0.7;
            transition: 0.3s;
        }

        .btn-settings:hover {
            opacity: 1;
            transform: rotate(45deg);
        }

        /* กล่องตั้งค่าการนับคะแนน (ซ่อนไว้เป็นส่วนตัว) */
        .settings-panel {
            display: none;
            position: absolute;
            right: 20px;
            top: 50px;
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #0f3460;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            text-align: left;
            z-index: 100;
            font-size: 14px;
            color: #ddd;
            width: 320px;
        }

        .settings-panel label {
            cursor: pointer;
            display: block;
            margin-bottom: 8px;
        }

        .settings-panel input[type="number"] {
            width: 45px;
            padding: 3px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #222;
            color: white;
            text-align: center;
        }

        h1 {
            color: #f1c40f;
            font-size: 36px;
            margin-bottom: 10px;
            margin-top: 10px;
        }

        #scoreDesc {
            color: #aaa;
            margin-bottom: 20px;
        }

        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-top: 40px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        /* สไตล์การ์ด 3 อันดับแรก */
        .top-card {
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            width: 220px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .top-card img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid;
            margin-bottom: 15px;
            background: white;
        }

        .top-card h3 {
            margin: 10px 0;
            font-size: 18px;
        }

        .top-card .score {
            font-size: 24px;
            font-weight: bold;
        }

        .rank-badge {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .rank-1 {
            order: 2;
            transform: translateY(-30px);
        }

        .rank-2 {
            order: 1;
        }

        .rank-3 {
            order: 3;
        }

        .rank-1 img {
            border-color: #FFD700;
        }

        .rank-1 .rank-badge {
            background: #FFD700;
        }

        .rank-1 .score {
            color: #FFD700;
        }

        .rank-2 img {
            border-color: #C0C0C0;
        }

        .rank-2 .rank-badge {
            background: #C0C0C0;
        }

        .rank-2 .score {
            color: #C0C0C0;
        }

        .rank-3 img {
            border-color: #CD7F32;
        }

        .rank-3 .rank-badge {
            background: #CD7F32;
        }

        .rank-3 .score {
            color: #CD7F32;
        }

        /* รายชื่ออันดับที่เหลือ */
        .others-container {
            max-width: 800px;
            margin: 0 auto;
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
        }

        .other-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #0f3460;
        }

        .other-row:last-child {
            border-bottom: none;
        }

        .other-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .other-info img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            background: white;
        }

        .other-rank {
            font-size: 18px;
            font-weight: bold;
            color: #888;
            width: 30px;
        }

        #loading {
            font-size: 20px;
            color: #f1c40f;
            margin-top: 50px;
        }

        @media (max-width: 600px) {
            .podium-container {
                flex-direction: column;
                align-items: center;
                gap: 40px;
            }

            .rank-1 {
                order: 1;
                transform: translateY(0);
            }

            .rank-2 {
                order: 2;
            }

            .rank-3 {
                order: 3;
            }
        }
    </style>
</head>

<body>

    <div class="admin-bar">
        <button class="btn-settings" onclick="toggleSettings()" title="ตั้งค่าการคำนวณคะแนน">⚙️</button>
        <button class="btn-clear" onclick="clearVotes()">🗑️ ล้างผลโหวตทั้งหมด</button>

        <div class="settings-panel" id="settingsPanel">
            <div
                style="margin-bottom: 10px; color: #f1c40f; font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 5px;">
                โหมดการคำนวณคะแนน</div>

            <label>
                <input type="radio" name="calcMode" value="normal" checked onchange="recalculateScores()">
                โหมดปกติ (ทุกคน 1 โหวต = 1 คะแนน)
            </label>

            <div style="margin-top: 15px;">
                <label>
                    <input type="radio" name="calcMode" value="ranked" onchange="recalculateScores()">
                    โหมดกำหนดคะแนนตามลำดับ:
                </label>
                <div style="padding-left: 25px; margin-top: 5px;">
                    อันดับ 1: <input type="number" id="pt1" value="3" oninput="checkRecalculate()"> pt<br>
                    อันดับ 2: <input type="number" id="pt2" value="2" oninput="checkRecalculate()"> pt<br>
                    อันดับ 3: <input type="number" id="pt3" value="1" oninput="checkRecalculate()"> pt
                </div>
            </div>
        </div>
    </div>

    <h1 id="titleText">🏆 Live Scoreboard ...</h1>
    <p id="scoreDesc">กำลังโหลดกติกา...</p>

    <div id="loading">กำลังประมวลผลคะแนน...</div>

    <div class="podium-container" id="top3"></div>

    <div class="others-container" id="others"></div>

    <script>
        // ⚠️ นำ URL เว็บแอป (Web App URL) ของคุณมาใส่ตรงนี้
        const BASE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_fRTUbzyuSR3oGoFl3W4S4Anda1sXUmWx8drsy4PphFy4atsWsaEyAky7BCfd1vVL/exec';
        const SCRIPT_URL = BASE_SCRIPT_URL + '?action=getScoreboard';

        let rawInternData = []; // เก็บข้อมูลดิบสำหรับไว้คำนวณใหม่โดยไม่ต้องโหลดเว็บใหม่

        const displayYear = (new Date().getFullYear() + 543) - 1;
        document.getElementById('titleText').innerText = `🏆 Scoreboard Intern ${displayYear}`;

        // โหลดข้อมูลดิบตอนเปิดหน้าเว็บ
        fetch(SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                rawInternData = data;
                document.getElementById('loading').style.display = 'none';
                recalculateScores(); // สั่งคำนวณและแสดงผลทันที
            })
            .catch(error => {
                document.getElementById('loading').innerText = 'เกิดข้อผิดพลาดในการดึงข้อมูล';
                console.error(error);
            });

        // ⚙️ เปิด/ปิด เมนูตั้งค่าคะแนน
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        // ตรวจสอบว่าถ้าอยู่ในโหมดกำหนดเอง ค่อยให้พิมพ์เลขแล้วคะแนนเด้งเปลี่ยนทันที
        function checkRecalculate() {
            const mode = document.querySelector('input[name="calcMode"]:checked').value;
            if (mode === 'ranked') recalculateScores();
        }

        // 🔄 ฟังก์ชันคำนวณคะแนนใหม่ตามโหมดที่เลือก (ทำในหน้าจอ ไม่ต้องโหลดเน็ตใหม่)
        function recalculateScores() {
            if (rawInternData.length === 0) return;

            const mode = document.querySelector('input[name="calcMode"]:checked').value;
            const pt1 = parseInt(document.getElementById('pt1').value) || 0;
            const pt2 = parseInt(document.getElementById('pt2').value) || 0;
            const pt3 = parseInt(document.getElementById('pt3').value) || 0;

            // คัดลอกและคำนวณคะแนนใหม่
            let updatedData = rawInternData.map(intern => {
                let score = 0;
                if (mode === 'normal') {
                    // โหมดปกติ: ทุกครั้งที่ถูกเลือก +1 คะแนน
                    score = intern.rank1Count + intern.rank2Count + intern.rank3Count;
                } else {
                    // โหมดกำหนดคะแนน: เอาจำนวนครั้งมาคูณกับ pt ที่แอดมินตั้งไว้
                    score = (intern.rank1Count * pt1) + (intern.rank2Count * pt2) + (intern.rank3Count * pt3);
                }
                return { ...intern, totalScore: score };
            });

            // เรียงลำดับจากมากไปน้อย
            updatedData.sort((a, b) => b.totalScore - a.totalScore);

            // เปลี่ยนข้อความอธิบายกติกา
            const desc = document.getElementById('scoreDesc');
            if (mode === 'normal') {
                desc.innerText = 'สรุปผลคะแนน (ผู้ที่ถูกเลือกจะได้ 1 คะแนนเท่ากันทุกคน)';
            } else {
                desc.innerText = `สรุปผลคะแนน (อันดับ 1 = ${pt1} pt, อันดับ 2 = ${pt2} pt, อันดับ 3 = ${pt3} pt)`;
            }

            // ส่งไปสร้างหน้าจอ
            renderScoreboard(updatedData);
        }

        // 🎨 ฟังก์ชันวาดหน้าจอ (ใช้โค้ดเดิม)
        function renderScoreboard(interns) {
            const top3Container = document.getElementById('top3');
            const othersContainer = document.getElementById('others');

            top3Container.innerHTML = ''; // ล้างของเก่า
            othersContainer.innerHTML = ''; // ล้างของเก่า

            interns.forEach((intern, index) => {
                const rank = index + 1;

                if (rank <= 3) {
                    const card = document.createElement('div');
                    card.className = `top-card rank-${rank}`;
                    card.innerHTML = `
                        <div class="rank-badge">${rank}</div>
                        <img src="${intern.imageUrl}" alt="${intern.name}">
                        <h3>${intern.name}</h3>
                        <div class="score">${intern.totalScore} คะแนน</div>
                    `;
                    top3Container.appendChild(card);
                } else {
                    const row = document.createElement('div');
                    row.className = 'other-row';
                    row.innerHTML = `
                        <div class="other-info">
                            <div class="other-rank">${rank}</div>
                            <img src="${intern.imageUrl}" alt="${intern.name}">
                            <span>${intern.name}</span>
                        </div>
                        <div style="font-weight: bold; color: #f1c40f;">${intern.totalScore} คะแนน</div>
                    `;
                    othersContainer.appendChild(row);
                }
            });
        }

        // 🛑 ฟังก์ชันสั่งล้างข้อมูลคะแนนโหวต (โค้ดเดิม)
        function clearVotes() {
            const pass = prompt('กรุณาใส่รหัสผ่านแอดมิน เพื่อ "ล้างข้อมูลผลโหวตทั้งหมด":');
            if (pass !== '1234') {
                if (pass !== null) alert('รหัสผ่านไม่ถูกต้อง');
                return;
            }

            if (!confirm('⚠️ คำเตือน: คุณแน่ใจหรือไม่ว่าต้องการลบผลโหวตทั้งหมด? การกระทำนี้ไม่สามารถย้อนกลับได้!')) {
                return;
            }

            alert('กำลังสั่งลบข้อมูลใน Google Sheet... กรุณารอสักครู่ครับ');

            const formData = new URLSearchParams();
            formData.append('action', 'clearVotes');

            fetch(BASE_SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        alert('ล้างผลโหวตเรียบร้อยแล้ว! คะแนนทุกคนกลับไปเป็น 0 และปลดล็อคให้โหวตใหม่ได้แล้วครับ');
                        window.location.reload();
                    } else {
                        alert('เกิดข้อผิดพลาดในการล้างข้อมูล');
                    }
                })
                .catch(error => {
                    console.error(error);
                    alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
                });
        }
    </script>
</body>

</html>
