<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard - Vote Intern</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: white;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #f1c40f;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-top: 40px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        /* สไตล์การ์ด 3 อันดับแรก */
        .top-card {
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            width: 220px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .top-card img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid;
            margin-bottom: 15px;
        }

        .top-card h3 {
            margin: 10px 0;
            font-size: 18px;
        }

        .top-card .score {
            font-size: 24px;
            font-weight: bold;
        }

        .rank-badge {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* จัดแท่นยืนอันดับ 1, 2, 3 */
        .rank-1 {
            order: 2;
            transform: translateY(-30px);
        }

        .rank-2 {
            order: 1;
        }

        .rank-3 {
            order: 3;
        }

        .rank-1 img {
            border-color: #FFD700;
        }

        .rank-1 .rank-badge {
            background: #FFD700;
        }

        .rank-1 .score {
            color: #FFD700;
        }

        .rank-2 img {
            border-color: #C0C0C0;
        }

        .rank-2 .rank-badge {
            background: #C0C0C0;
        }

        .rank-2 .score {
            color: #C0C0C0;
        }

        .rank-3 img {
            border-color: #CD7F32;
        }

        .rank-3 .rank-badge {
            background: #CD7F32;
        }

        .rank-3 .score {
            color: #CD7F32;
        }

        /* รายชื่ออันดับที่เหลือ */
        .others-container {
            max-width: 800px;
            margin: 0 auto;
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
        }

        .other-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #0f3460;
        }

        .other-row:last-child {
            border-bottom: none;
        }

        .other-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .other-info img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .other-rank {
            font-size: 18px;
            font-weight: bold;
            color: #888;
            width: 30px;
        }

        #loading {
            font-size: 20px;
            color: #f1c40f;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <h1 id="titleText">🏆 Live Scoreboard ...</h1>
    <p>สรุปผลคะแนนโหวต (อันดับ 1 = 3 คะแนน, อันดับ 2 = 2 คะแนน, อันดับ 3 = 1 คะแนน)</p>

    <div id="loading">กำลังประมวลผลคะแนน...</div>

    <div class="podium-container" id="top3"></div>

    <div class="others-container" id="others"></div>

    <script>
        // ⚠️ นำ URL เว็บแอป (Web App URL) ของคุณมาใส่ตรงนี้
        const BASE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_fRTUbzyuSR3oGoFl3W4S4Anda1sXUmWx8drsy4PphFy4atsWsaEyAky7BCfd1vVL/exec';

        // เติม ?action=getScoreboard ต่อท้าย URL อัตโนมัติ
        const SCRIPT_URL = BASE_SCRIPT_URL + (BASE_SCRIPT_URL.includes('?') ? '&' : '?') + 'action=getScoreboard';

        // ตั้งค่าปีอัตโนมัติ
        const displayYear = (new Date().getFullYear() + 543) - 1;
        document.getElementById('titleText').innerText = `🏆 Scoreboard Intern ${displayYear}`;

        // โหลดข้อมูลคะแนน
        fetch(SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                renderScoreboard(data);
            })
            .catch(error => {
                document.getElementById('loading').innerText = 'เกิดข้อผิดพลาดในการดึงข้อมูล';
                console.error(error);
            });

        function renderScoreboard(interns) {
            const top3Container = document.getElementById('top3');
            const othersContainer = document.getElementById('others');

            interns.forEach((intern, index) => {
                const rank = index + 1;

                if (rank <= 3) {
                    // สร้างการ์ดสำหรับ Top 3
                    const card = document.createElement('div');
                    card.className = `top-card rank-${rank}`;
                    card.innerHTML = `
                        <div class="rank-badge">${rank}</div>
                        <img src="${intern.imageUrl}" alt="${intern.name}">
                        <h3>${intern.name}</h3>
                        <div class="score">${intern.totalScore} pts</div>
                        <div style="font-size: 12px; color: #888; margin-top: 5px;">(โหวต ${intern.voteCount} ครั้ง)</div>
                    `;
                    top3Container.appendChild(card);
                } else {
                    // สร้างแถวสำหรับอันดับที่ 4 ลงไป (คนที่มีคะแนน 0 จะยังโชว์อยู่)
                    const row = document.createElement('div');
                    row.className = 'other-row';
                    row.innerHTML = `
                        <div class="other-info">
                            <div class="other-rank">${rank}</div>
                            <img src="${intern.imageUrl}" alt="${intern.name}">
                            <span>${intern.name}</span>
                        </div>
                        <div style="font-weight: bold; color: #f1c40f;">${intern.totalScore} pts</div>
                    `;
                    othersContainer.appendChild(row);
                }
            });
        }
    </script>
</body>

</html>
